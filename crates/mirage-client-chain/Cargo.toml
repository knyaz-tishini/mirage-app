[package]
name = "mirage-client-chain"
version = "0.1.0"
edition = "2021"
description = "Chain provisioning: the shape of a chain of boxes, the installer that puts them on their hosts, and the wiring that makes them relay as one."

[lib]
name = "mirage_client_chain"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
async-trait = "0.1"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2"
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "std"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "io-util"] }
