<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<title>Text colors</title>
<style>
.row2 { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; }
.tk { display: flex; flex-direction: column; gap: 4px; }
.tk .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.1em; }
.tk .v { font-family: var(--font-display); font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
.chip { display:inline-block; padding:2px 8px; border-radius:4px; background: var(--accent); color: #1A1400; font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
</style></head>
<body>
<div class="card stack">
  <div class="eyebrow">Text · Four levels + on-amber</div>
  <div class="row2">
    <div class="tk"><span class="label">fg-0</span><span class="v" style="color:#F4F4F5">Aa — Mirage</span></div>
    <div class="tk"><span class="label">fg-1</span><span class="v" style="color:#D7D8DB">Aa — Mirage</span></div>
    <div class="tk"><span class="label">fg-2</span><span class="v" style="color:#878B91">Aa — Mirage</span></div>
    <div class="tk"><span class="label">fg-3</span><span class="v" style="color:#555860">Aa — Mirage</span></div>
    <div class="tk"><span class="label">on-accent</span><span class="chip">Aa — 1A1400</span></div>
  </div>
</div>
</body></html>
