<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<title>Palette · Accent + Layer</title>
<style>
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sw { aspect-ratio: 1.5 / 1; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; border: 1px solid var(--border); }
.sw .n { font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
</style></head>
<body>
<div class="card stack">
  <div class="eyebrow">Accent · Layer-coded · Status</div>
  <div class="grid">
    <div class="sw" style="background:#FBB26A;color:#1A1400;border-color:transparent"><span class="n">accent</span><span>#FBB26A</span></div>
    <div class="sw" style="background:rgba(251,178,106,0.12);color:#FBB26A;border-color:rgba(251,178,106,0.3)"><span class="n">accent-dim</span><span>12% α</span></div>
    <div class="sw" style="background:#6DB8F5;color:#071725;border-color:transparent"><span class="n">L1 blue</span><span>#6DB8F5</span></div>
    <div class="sw" style="background:rgba(109,184,245,0.15);color:#6DB8F5;border-color:rgba(109,184,245,0.3)"><span class="n">L1 dim</span><span>15% α</span></div>
    <div class="sw" style="background:#5CB87A;color:#0A1F10;border-color:transparent"><span class="n">ok</span><span>#5CB87A</span></div>
    <div class="sw" style="background:#E8A838;color:#1A1200;border-color:transparent"><span class="n">warn</span><span>#E8A838</span></div>
    <div class="sw" style="background:#EB5757;color:#2A0A0A;border-color:transparent"><span class="n">error</span><span>#EB5757</span></div>
    <div class="sw" style="background:#14151A;color:#D7D8DB;"><span class="n">on-dark</span><span>amber only</span></div>
  </div>
</div>
</body></html>
