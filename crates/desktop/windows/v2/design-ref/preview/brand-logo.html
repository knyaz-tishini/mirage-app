<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<title>Brand · Logo</title>
<style>
.wrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: center; }
.cell { height: 100px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.06); border-radius: 6px; position: relative; }
.cell.dark { background: #0E0E11; }
.cell.raised { background: #1C1D23; }
.cell.amber { background: #FBB26A; }
.mark { display: inline-flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.02em; }
.mark.a { color: #FBB26A; }
.mark.fg { color: #F4F4F5; }
.mark.on { color: #1A1400; }
.meta { position: absolute; bottom: 6px; left: 10px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #555860; text-transform: uppercase; letter-spacing: 0.1em; }
.amber .meta { color: rgba(26,20,0,0.45); }
svg { display: block; }
</style></head>
<body>
<div class="card stack">
  <div class="eyebrow">Logo · Primary · On dark · On accent</div>
  <div class="wrap">
    <div class="cell dark"><span class="mark a">
      <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M12 2L3 7v10l9 5 9-5V7L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 2v20M3 7l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Mirage</span><span class="meta">primary · amber on bg</span></div>
    <div class="cell raised"><span class="mark fg">
      <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M12 2L3 7v10l9 5 9-5V7L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 2v20M3 7l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Mirage</span><span class="meta">mono · on surface</span></div>
    <div class="cell amber"><span class="mark on">
      <svg viewBox="0 0 24 24" fill="none" width="24" height="24"><path d="M12 2L3 7v10l9 5 9-5V7L12 2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 2v20M3 7l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Mirage</span><span class="meta">on accent</span></div>
  </div>
</div>
</body></html>
