<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<title>Eyebrows · Labels</title>
<style>
.row4 { display: flex; gap: 12px; flex-wrap: wrap; }
.eb { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 4px 8px; border-radius: 4px; }
.eb.amber { color: #FBB26A; background: rgba(251,178,106,0.12); border: 1px solid rgba(251,178,106,0.3); }
.eb.l1 { color: #6DB8F5; background: rgba(109,184,245,0.15); border: 1px solid rgba(109,184,245,0.3); }
.eb.ok { color: #5CB87A; background: rgba(92,184,122,0.1); border: 1px solid rgba(92,184,122,0.28); }
.eb.warn { color: #E8A838; background: rgba(232,168,56,0.1); border: 1px solid rgba(232,168,56,0.28); }
.eb.mute { color: #878B91; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
.num { font-family: 'JetBrains Mono', monospace; color: #555860; font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; }
</style></head>
<body>
<div class="card stack">
  <div class="eyebrow">Eyebrow labels · Mono · 11/10px · 0.1em tracking</div>
  <div class="row4">
    <span class="eb amber">01 · Infrastructure</span>
    <span class="eb l1">L1 RELAY · MOSCOW</span>
    <span class="eb ok">● ONLINE</span>
    <span class="eb warn">UNSTABLE</span>
    <span class="eb mute">v0.2.0</span>
    <span class="num">[14:02:17] handshake ok 185.x.x.x →</span>
  </div>
</div>
</body></html>
