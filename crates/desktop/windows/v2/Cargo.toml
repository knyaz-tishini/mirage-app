[package]
name = "mirage2light-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mirage2light"
path = "src/main.rs"

[dependencies]
mirage-core            = { path = "../../../../../mirage2web/crates/mirage-core" }
uzor                   = { path = "../../../../../uzor/uzor" }
uzor-desktop           = { path = "../../../../../uzor/uzor-desktop" }
uzor-backend-tiny-skia = { path = "../../../../../uzor/uzor-backend-tiny-skia" }
softbuffer             = "0.4"
tokio                  = { workspace = true }
serde                  = { workspace = true }
serde_json             = { workspace = true }
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }
reqwest                = { version = "0.12", features = ["json"] }
axum                   = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
rand                   = "0.8"
