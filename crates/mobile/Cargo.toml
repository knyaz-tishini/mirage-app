[package]
name = "mirage-client-mobile"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
mirage-core        = { workspace = true }
mirage-protocol    = { workspace = true }
mirage-client-core = { path = "../mirage-client-core" }
tokio              = { workspace = true }
tracing            = { workspace = true }
serde_json         = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni              = "0.21"
android_logger   = "0.14"
libc             = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
