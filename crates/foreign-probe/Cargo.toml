[package]
name    = "foreign-probe"
version = "0.1.0"
edition = "2021"

# Tiny SOCKS5 inbound that speaks one foreign wire (SS-AEAD-2017 or Trojan-TLS)
# upstream. Used to debug our standalone terminators end-to-end without
# pulling in xray / sing-box / v2rayTun — same wire bytes our `accept()`
# parses on the exit node. Build once, scp to any test box, run.

[[bin]]
name = "foreign-probe"
path = "src/main.rs"

[dependencies]
tokio                = { workspace = true }
clap                 = { workspace = true }
anyhow               = "1"
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
rand                 = { workspace = true }
hkdf                 = "0.12"
sha1                 = "0.10"
sha2                 = "0.10"
md-5                 = "0.10"
hex                  = "0.4"
aes-gcm              = "0.10"
chacha20poly1305     = "0.10"
rustls               = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls         = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
