[package]
name    = "mirage-l0-sentinel"
version = "0.1.0"
edition = "2021"

[lib]
name = "mirage_l0_sentinel"
path = "src/lib.rs"

[[bin]]
name = "mirage-l0-sentinel"
path = "src/main.rs"

# Standalone smoke-test binary: hardcoded creds, no children spawned, no
# config file lookup.  Just connects to the monitor and reports presence
# so we can verify reachability from a fresh user machine without asking
# them to do anything beyond double-clicking the exe.
[[bin]]
name = "mirage-sentinel-test"
path = "src/bin/mirage-sentinel-test.rs"

[dependencies]
mirage-client-core = { path = "../client-core" }
mirage-core        = { path = "../../../mirage2web/crates/mirage-core" }
arc-swap           = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
axum               = { workspace = true }
reqwest            = { workspace = true }
toml                 = "0.8"
anyhow               = "1"
rustls               = { version = "0.23", default-features = false, features = ["ring"] }
mirage-runtime-guard = { workspace = true }
uuid                 = { version = "1", features = ["v4"] }
tokio-tungstenite    = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util         = "0.3"
sha2                 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
