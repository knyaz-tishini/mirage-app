[package]
name    = "mirage-l0-sentinel"
version = "0.1.0"
edition = "2021"

[lib]
name = "mirage_l0_sentinel"
path = "src/lib.rs"

[[bin]]
name = "mirage-l0-sentinel"
path = "src/main.rs"

# Standalone smoke-test binary: hardcoded creds, no children spawned, no
# config file lookup.  Just connects to the monitor and reports presence
# so we can verify reachability from a fresh user machine without asking
# them to do anything beyond double-clicking the exe.
[[bin]]
name = "mirage-sentinel-test"
path = "src/bin/mirage-sentinel-test.rs"

[dependencies]
mirage-client-core = { path = "../client-core" }
mirage-core        = { path = "../../../mirage2web/crates/mirage-core" }
# The commercial artefact branch (T1.1) validates an `EntranceArtefact` with
# the SAME parser this crate spawns as a child — shared, never copied. See
# `src/entrance_artefact.rs`.
mirage-subscriber-client = { path = "../subscriber-client" }
arc-swap           = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
axum               = { workspace = true }
reqwest            = { workspace = true }
toml                 = "0.8"
ed25519-dalek        = { workspace = true }
# K2 v2: AccessPacketV2::validate derives the X25519 public key from the
# device's private key to prove the pair actually matches. Pinned to the
# same spec `mirage-core`'s own workspace declares (`version = "2", features
# = ["static_secrets"]`), already resolved to 2.0.1 in this workspace's
# Cargo.lock — this only makes it a DIRECT dependency of this crate too, no
# new version enters the graph.
x25519-dalek         = { version = "2", features = ["static_secrets"] }
hex                  = "0.4"
anyhow               = "1"
rustls               = { version = "0.23", default-features = false, features = ["ring"] }
mirage-runtime-guard = { workspace = true }
uuid                 = { version = "1", features = ["v4"] }
thiserror            = { workspace = true }
# Pinned to the version already resolved transitively in this workspace's
# Cargo.lock (pulled in by reqwest/tokio-tungstenite) — no new major version
# introduced. Used by access_packet.rs for the QR form (base64url, no pad).
base64               = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
