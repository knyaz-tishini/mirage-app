# mirage-l0-sentinel — minimal client config.
#
# Sentinel is passive: on boot it generates a stable sentry_id, registers
# with one of `monitor_urls`, and waits for the monitor to push chains
# over the WebSocket subscription. The monitor decides which chains the
# client gets based on policy. Operators/debug UIs can also call
# `/relay/clients/{id}/chains/request` directly with an axis-spec — that
# is NOT sentinel's job and there is no `[axis_request]` block here.

# ─── Mesh + identity ──────────────────────────────────────────────────────────
mesh_id   = "v3-staging"
shortname = "tester1"             # surfaces in /relay/clients
role      = "sentry-client"

# ─── Monitor endpoints + bearer ───────────────────────────────────────────────
# Bootstrap fallback. Once registered, the monitor pushes the live
# `peer_lm_urls` list via WS Config; sentinel persists it under
# `${state_dir}/monitor_urls.json` and prefers it on subsequent boots.
monitor_urls = [
  "https://lm-ru-1.zen-geldmaschine.net:19451",
  "https://lm-nl-1.zen-geldmaschine.net:19451",
  "https://lm-ch-1.zen-geldmaschine.net:19451",
]
monitor_api_key = "<paste Client-role bearer here>"

# State directory — sentry-id.txt, client-id.txt, monitor_urls.json,
# debug-tunnel.json. Created on first boot.
state_dir = "C:/ProgramData/mirage/state"

# ─── client-config materialisation + spawning ─────────────────────────────────
client_template    = "client-template.json"
client_config_path = "client-config.json"
client_binary      = "mirage-client-cli.exe"
client_args        = ["-c", "{client_config_path}"]
respect_user_config = true

# Set to "cli2" to spawn `mirage-chain-supervisor` instead of cli1.
cli_variant = "cli1"
