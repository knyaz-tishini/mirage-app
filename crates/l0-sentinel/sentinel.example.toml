# mirage-l0-sentinel — minimal client config.
#
# Sentinel is passive: on boot it generates a stable sentinel_id, registers
# over the Mirage native wire (`monitor_wire_addr` + `monitor_wire_pubkey_hex`
# below), and waits for the monitor to push chains over the same wire
# subscription. The monitor decides which chains the client gets based on
# policy. Operators/debug UIs can also call `/relay/clients/{id}/chains/request`
# directly with an axis-spec — that is NOT sentinel's job and there is no
# `[axis_request]` block here.

# ─── Mesh + identity ──────────────────────────────────────────────────────────
mesh_id   = "v3-staging"
shortname = "tester1"             # surfaces in /relay/clients
role      = "sentry-client"

# ─── Monitor wire coordinates + bearer ─────────────────────────────────────────
# Required bootstrap: the monitor's Mirage-native wire listener (`:19444`).
# opbox bakes these into every issued client config; obtain from opbox
# inventory or `GET <monitor>/relay/me` on first boot.
monitor_wire_addr        = "103.231.75.144:19444"
monitor_wire_pubkey_hex  = "<64-char hex — monitor's static X25519 pubkey>"
monitor_api_key          = "<paste Client-role bearer here>"

# State directory — sentinel-id.txt, client-id.txt, monitor_wire.json,
# debug-tunnel.json. Created on first boot.
state_dir = "C:/ProgramData/mirage/state"

# ─── client-config materialisation + spawning ─────────────────────────────────
client_template    = "client-template.json"
client_config_path = "client-config.json"
respect_user_config = true

# Path to the chain-supervisor binary.  Defaults to
# <exe_dir>/mirage-chain-supervisor[.exe] when omitted.
# supervisor_binary = "C:/Program Files/Mirage/mirage-chain-supervisor.exe"
# supervisor_args   = ["{client_config_path}"]

# ─── Debug shell (operator-fleet boxes only — leave unset for any customer) ───
# `false` by default. Nothing server-side (monitor push, AccessPacket) can
# turn this on — it is a local, hand-edited opt-in only. A mode-3/customer
# issuance of this file must never set it. See l0-sentinel's `CLAUDE.md`
# "Debug-shell + dynamic monitor URLs".
# allow_operator_debug_shell = true
# debug_shell_binary = "C:/Program Files/Mirage/mirage-probe.exe"
