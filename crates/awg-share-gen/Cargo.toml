[package]
name    = "awg-share-gen"
version = "0.1.0"
edition = "2021"

# AmneziaWG share-config generator. Emits the three formats Amnezia clients
# accept for a "connection-only" (non-self-hosted, no SSH-provisioning) profile:
#   • phone.conf       — wg-quick .conf with Amnezia Jc/Jmin/Jmax/S1..S2/H1..H4
#   • vpn-uri.txt      — `vpn://...` URI (Qt qCompress + URL-safe base64) for
#                         Amnezia mobile/desktop "paste link / from text" import
#   • phone-qr.png     — same URI rendered as QR (Amnezia mobile camera import)
#
# Output goes to a directory; CLI is `awg-share-gen --help`.

[[bin]]
name = "awg-share-gen"
path = "src/main.rs"

[dependencies]
clap         = { version = "4", features = ["derive"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
flate2       = "1"
base64       = "0.22"
qrcode       = { version = "0.14", default-features = false }
image        = { version = "0.25", default-features = false, features = ["png"] }
anyhow       = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core    = { version = "0.6", features = ["std"] }
mirage-standalone-templates = { workspace = true }
