[package]
name = "mirage-chain-worker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mirage-chain-worker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mirage-chain-ipc     = { path = "../ipc" }
mirage-runtime-guard = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arc-swap = { workspace = true }
mirage-core = { workspace = true }
mirage-protocol = { workspace = true }
mirage-client-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
