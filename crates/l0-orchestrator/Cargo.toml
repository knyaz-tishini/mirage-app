[package]
name    = "mirage-l0-orchestrator"
version = "0.1.0"
edition = "2021"

[lib]
name = "mirage_l0_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "mirage-l0-orchestrator"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
tokio-util         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
clap               = { workspace = true }
toml               = "0.8"
anyhow             = "1"
async-trait        = "0.1"
mirage-runtime-guard = { workspace = true }

# In-process embedding (mobile / single-binary mode):
# orchestrator can call sentinel::run directly as a tokio task instead of
# spawning a subprocess. The cli2 data-plane runs ONLY in process mode
# (Generic), so no data-plane lib dep here. (cli1 dep removed 2026-06-14.)
mirage-l0-sentinel  = { path = "../l0-sentinel" }
