[package]
name    = "v2ray-share-gen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "v2ray-share-gen"
path = "src/main.rs"

[dependencies]
clap    = { version = "4", features = ["derive"] }
qrcode  = { version = "0.14", default-features = false }
image   = { version = "0.25", default-features = false, features = ["png"] }
anyhow  = "1"
