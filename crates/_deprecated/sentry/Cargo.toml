[package]
name    = "mirage-sentry"
version = "0.1.0"
edition = "2021"

# MVP sentry — always-on companion to mirage-slavyanka on a trusted box.
# Spawns slavyanka, restarts on crash, posts heartbeat JSON to the monitor.
# No signed-manifest verification, no probe-spawn endpoints — those belong to
# the full design in `mirage2monitor/docs/admin-layer-concept.md`, deliberately
# out of scope for this MVP.

[lib]
name = "mirage_sentry"
path = "src/lib.rs"

[[bin]]
name = "mirage-sentry"
path = "src/main.rs"

[features]
default          = ["client-mode"]
client-mode      = []
server-lm-mode   = []
server-node-mode = []

[dependencies]
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = "1"
reqwest            = { workspace = true }
mirage-runtime-guard = { workspace = true }
mirage-slavyanka     = { path = "../slavyanka" }
rustls               = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite    = { workspace = true }
futures-util         = "0.3"
futures              = "0.3"
uuid                 = { version = "1", features = ["v4"] }
