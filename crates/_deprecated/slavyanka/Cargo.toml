[package]
name    = "mirage-slavyanka"
version = "0.1.0"
edition = "2021"

# MVP simplified-Slavyanka: reverse-SSH from a trusted dev box (tester1) out to a
# chosen LM, optionally dialed through the local mirage-client-cli SOCKS5 proxy.
# No signed manifests, no per-target embedded keys, no hardware-token verify —
# this binary is for OWN boxes only. See `docs/admin-layer-concept.md` in
# mirage2monitor for the full design we are deliberately NOT implementing here.

[lib]
name = "mirage_slavyanka"
path = "src/lib.rs"

[[bin]]
name = "mirage-slavyanka"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
serde              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = "1"
toml               = "0.8"
clap               = { workspace = true }
russh              = "0.60"
tokio-socks        = "0.5"
mirage-runtime-guard = { workspace = true }
