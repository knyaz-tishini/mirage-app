<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage centerpiece — bloom variant</title>
<style>
  body{margin:0;background:#0b0b0e;color:#f4f4f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px}
  h1{font-size:13px;letter-spacing:.16em;font-weight:500;color:#fbb26a;margin:0 0 6px}
  .sub{font-size:11px;color:#878b91;margin-bottom:14px}
  .clk{color:#fbb26a}
  .lbl{font-size:11px;color:#878b91;margin-bottom:6px;letter-spacing:.05em}
  .card{background:#14151a;border:1px solid #ffffff14;border-radius:12px;padding:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  canvas{display:block;width:100%;border-radius:6px;background:#060507}
  .mctl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .mbtn{font:11px ui-monospace,monospace;background:#0b0b0e;color:#c9ccd1;border:1px solid #ffffff24;border-radius:6px;padding:4px 9px;cursor:pointer;letter-spacing:.04em}
  .mbtn:hover{border-color:#fbb26a;color:#fbb26a}
</style>
</head>
<body>
<h1>MIRAGE · CENTERPIECE — BLOOM VARIANT</h1>
<div class="sub">one model, three rasterizers · grows on ready · opens/closes by local time <span class="clk" id="clk">--:--:--</span> <span id="ph"></span></div>
<div class="mctl"><button class="mbtn" id="b-ready">ready: off</button><button class="mbtn" id="b-auto">auto: on</button></div>
<div class="grid">
  <div class="card"><div class="lbl">PIXEL</div><canvas id="cpix" width="240" height="200"></canvas></div>
  <div class="card"><div class="lbl">HALFTONE</div><canvas id="chalf" width="240" height="200"></canvas></div>
  <div class="card"><div class="lbl">ASCII</div><canvas id="casc" width="240" height="200"></canvas></div>
</div>
<script>
(function(){
const BG="#060507",TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const q=id=>document.getElementById(id);
function ihash(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+s)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
const lerpC=(a,b,t)=>[a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];
const css=c=>"rgb("+c[0]+","+c[1]+","+c[2]+")";
const BW=240,BH=180,RAMP=" .,:;ox%#@";
function makeBuf(){const c=document.createElement("canvas");c.width=BW;c.height=BH;return{c,x:c.getContext("2d")};}

function rasterize(ctx,W,H,buf,mode,step){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 if(mode===0){ctx.imageSmoothingEnabled=true;ctx.drawImage(buf.c,0,0,W,H);return;}
 let id;try{id=buf.x.getImageData(0,0,BW,BH).data;}catch(e){return;}
 const sx=W/BW,sy=H/BH;
 if(mode===3){ctx.textBaseline="top";ctx.font=Math.ceil(step*sy)+"px ui-monospace,monospace";}
 for(let y=0;y<BH;y+=step)for(let x2=0;x2<BW;x2+=step){const j=(y*BW+x2)*4,r=id[j],g=id[j+1],b=id[j+2],lum=(r*0.299+g*0.587+b*0.114)/255;
  if(lum<0.03)continue;
  if(mode===1){ctx.fillStyle="rgb("+r+","+g+","+b+")";ctx.fillRect(x2*sx,y*sy,step*sx-0.6,step*sy-0.6);}
  else if(mode===2){ctx.fillStyle="rgb("+r+","+g+","+b+")";ctx.beginPath();ctx.arc((x2+step/2)*sx,(y+step/2)*sy,lum*step*sx*0.62,0,TAU);ctx.fill();}
  else{ctx.fillStyle="rgb("+Math.min(r+45,255)+","+Math.min(g+45,255)+","+Math.min(b+45,255)+")";ctx.fillText(RAMP[clamp(lum*RAMP.length|0,0,RAMP.length-1)],x2*sx,y*sy);}}
}

function petal(x,cx,cy,a,rb,L,w,col,h){const bx=cx+Math.cos(a)*rb,by=cy+Math.sin(a)*rb,tx=cx+Math.cos(a)*(rb+L),ty=cy+Math.sin(a)*(rb+L);
 const c1x=cx+Math.cos(a-w)*(rb+L*0.62),c1y=cy+Math.sin(a-w)*(rb+L*0.62),c2x=cx+Math.cos(a+w)*(rb+L*0.62),c2y=cy+Math.sin(a+w)*(rb+L*0.62);
 const v=0.88+h*0.24;x.fillStyle="rgb("+(col[0]*v|0)+","+(col[1]*v|0)+","+(col[2]*v|0)+")";
 x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(c1x,c1y,tx,ty);x.quadraticCurveTo(c2x,c2y,bx,by);x.closePath();x.fill();}

const buf=makeBuf(),seedi=987654;const outer=[255,224,188],inner=[251,168,96],deep=[206,116,52],coreC=[120,66,30];
let growT=0,ready=false,auto=true,frame=0,rot=0;
const outs=[{c:q("cpix"),m:1},{c:q("chalf"),m:2},{c:q("casc"),m:3}];
outs.forEach(o=>o.x=o.c.getContext("2d"));
const STEP={1:4,2:5,3:5};
q("b-ready").addEventListener("click",()=>{ready=!ready;auto=false;q("b-auto").textContent="auto: off";q("b-ready").textContent="ready: "+(ready?"on":"off");});
q("b-auto").addEventListener("click",()=>{auto=!auto;frame=0;q("b-auto").textContent="auto: "+(auto?"on":"off");});

function drawBloom(ge,e){const x=buf.x,cx=BW/2,cy=BH*0.46;x.fillStyle=BG;x.fillRect(0,0,BW,BH);
 if(ge<0.55){const seeds=70;for(let i=0;i<seeds;i++){const a=ihash(i,1,seedi)*TAU,rr=ihash(i,2,seedi)*40,px=cx+Math.cos(a)*rr,py=cy+18+ihash(i,3,seedi)*60;
   const al=(0.55-ge)*0.9*ihash(i,4,seedi);x.fillStyle="rgba(251,168,96,"+al.toFixed(2)+")";x.fillRect(px,py,2,2);}}
 x.strokeStyle="rgb("+(58-e*8|0)+",84,40)";x.lineWidth=3;x.beginPath();x.moveTo(cx,BH);x.quadraticCurveTo(cx+4,BH*0.78,cx,cy+8);x.stroke();
 const rings=6,R=60*ge,headR=R*(0.5+0.5*e);
 for(let k=0;k<rings;k++){const kt=k/(rings-1),count=11-k,col=lerpC(outer,k<rings-2?inner:deep,kt),L=headR*(1-kt*0.55)*(0.4+0.6*e),rb=2+headR*0.08*(1-kt),w=TAU/count*0.46*(0.45+0.55*e);
  for(let i=0;i<count;i++){const h1=ihash(k,i,seedi),h2=ihash(i,k,seedi+7),a=rot*(k%2?1.2:-1)+(i+k*0.5)/count*TAU+(h1-0.5)*0.22;petal(x,cx,cy,a,rb,L*(0.85+h2*0.3),w,col,h1);}}
 x.fillStyle=css(coreC);x.beginPath();x.arc(cx,cy,(1-e)*9*ge+4*ge+1,0,TAU);x.fill();
 if(e>0.6){x.fillStyle="rgb(255,212,120)";for(let i=0;i<14;i++){const a=i/14*TAU+rot*3,rr=((1-e)*9+4)*0.7*ihash(i,3,seedi)+2;x.fillRect(cx+Math.cos(a)*rr-0.8,cy+Math.sin(a)*rr-0.8,1.6,1.6);}}}

function pad(n){return(n<10?"0":"")+n;}
(function loop(){frame++;if(auto&&frame>90)ready=true;if(auto)q("b-ready").textContent="ready: "+(ready?"on":"off");
 growT+=((ready?1:0)-growT)*0.02;rot+=0.0009;
 const now=new Date(),secs=now.getHours()*3600+now.getMinutes()*60+now.getSeconds()+now.getMilliseconds()/1000;
 const period=20,ph=(secs%period)/period,open=0.5-0.5*Math.cos(ph*TAU),ge=growT*growT*(3-2*growT);
 q("clk").textContent=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
 q("ph").textContent="· "+(open>0.55?"opening":"closing")+" "+(open*100|0)+"%";
 drawBloom(ge,open*ge);
 for(const o of outs)rasterize(o.x,o.c.width,o.c.height,buf,o.m,STEP[o.m]);
 requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
