<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage centerpiece — bloom variant</title>
<style>
  body{margin:0;background:#0b0b0e;color:#f4f4f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px}
  h1{font-size:13px;letter-spacing:.16em;font-weight:500;color:#fbb26a;margin:0 0 6px}
  .sub{font-size:11px;color:#878b91;margin-bottom:12px}
  .clk{color:#fbb26a}
  .card{background:#14151a;border:1px solid #ffffff14;border-radius:12px;padding:10px;max-width:460px}
  canvas{display:block;width:100%;border-radius:6px;background:#060507;cursor:pointer}
  .mctl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .mbtn{font:11px ui-monospace,monospace;background:#0b0b0e;color:#c9ccd1;border:1px solid #ffffff24;border-radius:6px;padding:4px 9px;cursor:pointer;letter-spacing:.04em}
  .mbtn:hover{border-color:#fbb26a;color:#fbb26a}
</style>
</head>
<body>
<h1>MIRAGE · CENTERPIECE — BLOOM VARIANT</h1>
<div class="sub">off ascii(360°,no stem) → bud ascii(stem grows) → ready halftone → connected pixel + halo + sparkle, angle by time (45° night / 360° day) &nbsp; <span class="clk" id="clk"></span> <span id="ph"></span></div>
<div class="mctl"><button class="mbtn" data-st="0">off</button><button class="mbtn" data-st="1">bud</button><button class="mbtn" data-st="2">ready</button><button class="mbtn" data-st="3">connected</button><button class="mbtn" id="b-auto">auto: on</button></div>
<div class="card"><canvas id="cstage" width="420" height="315"></canvas></div>
<script>
(function(){
const BG="#060507",TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const q=id=>document.getElementById(id);
function ihash(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+s)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
const lerpC=(a,b,t)=>[a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];
const css=c=>"rgb("+c[0]+","+c[1]+","+c[2]+")";
const BW=240,BH=180,RAMP=" .,:;ox%#@";
function makeBuf(){const c=document.createElement("canvas");c.width=BW;c.height=BH;return{c,x:c.getContext("2d")};}

function rasterize(ctx,W,H,id,mode,step){ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 const sx=W/BW,sy=H/BH;
 if(mode===3){ctx.textBaseline="top";ctx.font=Math.ceil(step*sy)+"px ui-monospace,monospace";}
 for(let y=0;y<BH;y+=step)for(let x2=0;x2<BW;x2+=step){const j=(y*BW+x2)*4,r=id[j],g=id[j+1],b=id[j+2],lum=(r*0.299+g*0.587+b*0.114)/255;
  if(lum<0.03)continue;
  if(mode===1){ctx.fillStyle="rgb("+r+","+g+","+b+")";ctx.fillRect(x2*sx,y*sy,step*sx-0.6,step*sy-0.6);}
  else if(mode===2){ctx.fillStyle="rgb("+r+","+g+","+b+")";ctx.beginPath();ctx.arc((x2+step/2)*sx,(y+step/2)*sy,lum*step*sx*0.62,0,TAU);ctx.fill();}
  else{ctx.fillStyle="rgb("+Math.min(r+45,255)+","+Math.min(g+45,255)+","+Math.min(b+45,255)+")";ctx.fillText(RAMP[clamp(lum*RAMP.length|0,0,RAMP.length-1)],x2*sx,y*sy);}}
}

function petal(x,cx,cy,a,rb,L,w,col,h){const bx2=cx+Math.cos(a)*rb,by2=cy+Math.sin(a)*rb,tx=cx+Math.cos(a)*(rb+L),ty=cy+Math.sin(a)*(rb+L);
 const c1x=cx+Math.cos(a-w)*(rb+L*0.62),c1y=cy+Math.sin(a-w)*(rb+L*0.62),c2x=cx+Math.cos(a+w)*(rb+L*0.62),c2y=cy+Math.sin(a+w)*(rb+L*0.62);
 const v=0.88+h*0.24;x.fillStyle="rgb("+(col[0]*v|0)+","+(col[1]*v|0)+","+(col[2]*v|0)+")";
 x.beginPath();x.moveTo(bx2,by2);x.quadraticCurveTo(c1x,c1y,tx,ty);x.quadraticCurveTo(c2x,c2y,bx2,by2);x.closePath();x.fill();}

const buf=makeBuf(),bx=buf.x,seedi=987654;
const inner=[251,168,96],outer=[255,226,190],coreC=[120,66,30];
let state=0,auto=true,frame=0,rot=0;
let glowI=0,stemT=0,spd=360,eNorm=1;
function smooth(u){return u*u*(3-2*u);}
function spreadDeg(h){if(h>=8&&h<=16)return 360;if(h>=23||h<=1)return 45;
 if(h>16&&h<23)return 360+(45-360)*smooth((h-16)/7);
 return 45+(360-45)*smooth((h-1)/7);}
const oc=q("cstage"),octx=oc.getContext("2d");
function setState(s){state=s;auto=false;q("b-auto").textContent="auto: off";}
document.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>setState(+b.dataset.st)));
q("b-auto").addEventListener("click",()=>{auto=!auto;frame=0;q("b-auto").textContent="auto: "+(auto?"on":"off");});
oc.addEventListener("pointerdown",()=>{setState((state+1)%4);});

function drawScene(){const hx=BW/2,hy=90-28*stemT;bx.fillStyle=BG;bx.fillRect(0,0,BW,BH);
 if(glowI>0.02){const gr=20+18*glowI,pulse=1+0.12*Math.sin(frame*0.08),g=bx.createRadialGradient(hx,hy,0,hx,hy,gr*pulse);
  g.addColorStop(0,"rgba(255,216,152,"+(0.9*glowI).toFixed(2)+")");g.addColorStop(0.5,"rgba(251,168,96,"+(0.35*glowI).toFixed(2)+")");g.addColorStop(1,"rgba(251,168,96,0)");
  bx.fillStyle=g;bx.beginPath();bx.arc(hx,hy,gr*pulse,0,TAU);bx.fill();}
 if(stemT>0.05){bx.strokeStyle="rgb(70,90,46)";bx.lineWidth=2.4;bx.globalAlpha=Math.min(1,stemT*1.6);bx.beginPath();bx.moveTo(hx,166);bx.quadraticCurveTo(hx+3,(166+hy)/2,hx,hy+6);bx.stroke();bx.globalAlpha=1;}
 const P=12,headR=22,e=eNorm,spread=spd*Math.PI/180;
 for(let i=0;i<P;i++){const ti=(i/(P-1)-0.5),a=-Math.PI/2+ti*spread,h=ihash(i,1,seedi),L=headR*(0.5+0.7*e)*(0.85+h*0.3),w=0.10+0.24*e,col=lerpC(inner,outer,clamp(Math.abs(ti)*1.5,0,1));
  petal(bx,hx,hy,a,3,L,w,col,h);}
 bx.fillStyle=css(coreC);bx.beginPath();bx.arc(hx,hy,4,0,TAU);bx.fill();
 if(e>0.5){bx.fillStyle="rgb(255,214,130)";for(let i=0;i<12;i++){const a=-Math.PI/2+(i/11-0.5)*spread*0.8,rr=5+ihash(i,3,seedi)*6;bx.fillRect(hx+Math.cos(a)*rr-0.8,hy+Math.sin(a)*rr-0.8,1.5,1.5);}}
 if(glowI>0.05){const nsp=Math.floor(4+10*glowI),gr2=20+18*glowI;for(let i=0;i<nsp;i++){const a=Math.random()*TAU,rr=gr2*0.5+Math.random()*gr2,px=hx+Math.cos(a)*rr,py=hy+Math.sin(a)*rr,al=Math.random()*glowI*0.9;bx.fillStyle="rgba(255,236,200,"+al.toFixed(2)+")";bx.fillRect(px,py,1.3,1.3);}}
}

function pad(n){return(n<10?"0":"")+n;}
(function loop(){frame++;
 if(auto){const seq=[90,90,110,680],tot=970,f=frame%tot;let acc=0,st=0;for(let k=0;k<seq.length;k++){acc+=seq[k];if(f<acc){st=k;break;}}state=st;}
 glowI+=((state>=3?1:0)-glowI)*0.05;stemT+=((state>=1?1:0)-stemT)*0.03;
 const simHour=(frame*0.06)%24,tgt=state>=3?spreadDeg(simHour):360;spd+=(tgt-spd)*0.05;eNorm=clamp((spd-45)/315,0,1);rot+=0.0009;
 drawScene();
 const id=bx.getImageData(0,0,BW,BH).data,mode=state<=1?3:state===2?2:1;
 rasterize(octx,oc.width,oc.height,id,mode,mode===1?4:5);
 q("clk").textContent=state>=3?("sim "+pad(simHour|0)+":00"):"";
 q("ph").textContent=["· off · ascii · 360°","· bud · ascii · stem","· ready · halftone","· connected · pixel · "+(spd|0)+"° "+(eNorm*100|0)+"%"][state];
 requestAnimationFrame(loop);})();
})();
</script>
</body>
</html>
