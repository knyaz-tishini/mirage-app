<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage centerpiece — morph scene (grid → real planet + nodes)</title>
<style>
  body{margin:0;background:#0b0b0e;color:#f4f4f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px}
  h1{font-size:13px;letter-spacing:.16em;font-weight:500;color:#fbb26a;margin:0 0 14px}
  .lbl{font-size:11px;color:#878b91;margin-bottom:6px;letter-spacing:.05em}
  .hint{color:#555860}
  .card{background:#14151a;border:1px solid #ffffff14;border-radius:12px;padding:10px;margin-bottom:14px}
  canvas{display:block;width:100%;border-radius:6px;touch-action:none;cursor:grab}
  .mctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .mbtn{font:11px ui-monospace,monospace;background:#0b0b0e;color:#c9ccd1;border:1px solid #ffffff24;border-radius:6px;padding:4px 9px;cursor:pointer;letter-spacing:.04em}
  .mbtn:hover{border-color:#fbb26a;color:#fbb26a}
</style>
</head>
<body>
<h1>MIRAGE · CENTERPIECE — MORPH SCENE</h1>
<div class="card">
  <div class="lbl">RELIEF → REAL PLANET → MESH <span class="hint">— drag = rotate · dbl-click = connect/disconnect · tap a node = its IP · wheel = zoom</span></div>
  <canvas id="gmorph" width="600" height="360" style="background:#0b0b0e"></canvas>
  <div class="mctl">
    <button class="mbtn" data-ms="0">boot</button>
    <button class="mbtn" data-ms="1">services up</button>
    <button class="mbtn" data-ms="2">collapse</button>
    <button class="mbtn" data-ms="3">connected</button>
    <button class="mbtn" id="m-auto">auto: on</button>
  </div>
</div>
<!-- d3 + topojson load the real Natural-Earth land mask (world-atlas) at runtime.
     For the uzor/Rust port: bake the mask to a static array, and feed real fleet
     nodes (id/ip/region/geo) from inventory.toml / opbox /mesh/inventory. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(function(){
const BG="#0b0b0e",FG0="#f4f4f5",FG1="#878b91",FG3="#555860",AMBER="#fbb26a",AMBER_HI="#ffd9b0",TAU=Math.PI*2,DEG=180/Math.PI;
const q=id=>document.getElementById(id),clamp=(v,a,b)=>v<a?a:(v>b?b:v);
function ihash(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+s)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=ihash(xi,yi,s),b=ihash(xi+1,yi,s),c=ihash(xi,yi+1,s),d=ihash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

function MORPH(){const c=q("gmorph"),x=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2;
 const Ng=50,ns=4242,N=Ng*Ng,GA=Math.PI*(3-Math.sqrt(5)),PTS=[];
 for(let i=0;i<Ng;i++)for(let j=0;j<Ng;j++){const u=i/(Ng-1),v=j/(Ng-1),k=i*Ng+j;
  const fy=1-(k/(N-1))*2,fr=Math.sqrt(Math.max(0,1-fy*fy)),fth=GA*k,fib=[Math.cos(fth)*fr,fy,Math.sin(fth)*fr];
  PTS[k]={px:(u-0.5)*2.0,pz:(v-0.5)*2.0,fib,i,j,latd:Math.asin(clamp(fy,-1,1))*DEG,lond:-Math.atan2(fib[2],fib[0])*DEG,land:false};}
 const MW=360,MH=180;let mask=null;
 function isLand(latd,lond){if(!mask)return false;const px=((Math.floor((lond+180)/360*MW))%MW+MW)%MW,py=clamp(Math.floor((90-latd)/180*MH),0,MH-1);return mask[(py*MW+px)*4]>128;}
 (async function(){try{
  const topo=await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json());
  const off=document.createElement("canvas");off.width=MW;off.height=MH;const o=off.getContext("2d");
  const proj=d3.geoEquirectangular().scale(MW/TAU).translate([MW/2,MH/2]),path=d3.geoPath(proj,o);
  o.fillStyle="#fff";o.beginPath();path(topojson.merge(topo,topo.objects.countries.geometries));o.fill();
  mask=o.getImageData(0,0,MW,MH).data;for(let k=0;k<N;k++)PTS[k].land=isLand(PTS[k].latd,PTS[k].lond);
 }catch(e){}})();
 function geo(lat,lon){const la=lat/DEG,lo=lon/DEG;return[Math.cos(la)*Math.cos(lo),Math.sin(la),-Math.cos(la)*Math.sin(lo)];}
 const NODES=[
  {reg:"RU",ip:"193.187.94.74",lat:55.75,lon:37.62},{reg:"RU",ip:"91.218.245.247",lat:59.93,lon:30.34},
  {reg:"TR",ip:"82.26.94.247",lat:41.01,lon:28.98},{reg:"NL",ip:"45.12.212.226",lat:52.37,lon:4.90},
  {reg:"NL",ip:"151.243.173.104",lat:51.92,lon:4.48},{reg:"CH",ip:"45.59.119.139",lat:47.37,lon:8.54}];
 NODES.forEach(n=>{n.p=geo(n.lat,n.lon);n.sx=0;n.sy=0;n.front=false;});
 const LINKS=[[0,2],[2,5],[1,3],[3,5],[0,1],[4,2]];
 let yaw=0.5,pitch=0.4,vyaw=0.015,vpitch=0,zoom=1,drag=null,t=0,selNode=-1;
 let state=0,auto=true,autoT=0,fold=0,colT=0,amp=0.16,mesh=0;
 function rot(p){const cyw=Math.cos(yaw),syw=Math.sin(yaw),x1=p[0]*cyw+p[2]*syw,z1=-p[0]*syw+p[2]*cyw,y1=p[1];
  const cp=Math.cos(pitch),sp=Math.sin(pitch),y2=y1*cp-z1*sp,z2=y1*sp+z1*cp;return[x1,y2,z2];}
 const Rr=()=>150*zoom;
 function lbl(){const b=q("m-auto");if(b)b.textContent="auto: "+(auto?"on":"off");}
 c.addEventListener("pointerdown",e=>{drag={x:e.offsetX,y:e.offsetY,m:0};vyaw=vpitch=0;c.style.cursor="grabbing";});
 c.addEventListener("pointermove",e=>{if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);yaw+=dx*0.008;pitch=clamp(pitch+dy*0.008,-1.35,1.35);vyaw=dx*0.008;vpitch=dy*0.008;drag.x=e.offsetX;drag.y=e.offsetY;}});
 window.addEventListener("pointerup",()=>{if(drag&&drag.m<6){const tx=drag.x,ty=drag.y;let best=-1,bd=16*16;
   for(let ni=0;ni<NODES.length;ni++){const n=NODES[ni];if(!n.front)continue;const dx=n.sx-tx,dy=n.sy-ty,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=ni;}}
   selNode=(best>=0)?(selNode===best?-1:best):selNode;}drag=null;c.style.cursor="grab";});
 c.addEventListener("dblclick",()=>{auto=false;state=(state>=3?0:3);lbl();});
 c.addEventListener("wheel",e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:0.926;zoom=clamp(zoom,0.6,3.2);},{passive:false});
 document.querySelectorAll("[data-ms]").forEach(b=>b.addEventListener("click",()=>{auto=false;state=+b.dataset.ms;lbl();}));
 const ab=q("m-auto");if(ab)ab.addEventListener("click",()=>{auto=!auto;autoT=0;lbl();});
 const dwell=[150,150,300,320],total=dwell.reduce((a,b)=>a+b,0);
 function hgt(i,j){return (vnoise(i*0.22,j*0.22+t*0.4,ns)-0.5)+0.25*Math.sin((i+j)*0.42+t*1.8);}
 function lerpCa(cc){const r=Math.round(244+(251-244)*cc),g=Math.round(244+(178-244)*cc),b=Math.round(245+(106-245)*cc);return r+","+g+","+b;}
 (function d(){t+=0.016;
  if(auto){autoT++;if(autoT>=total)autoT=0;let acc=0,st=0;for(let k=0;k<dwell.length;k++){acc+=dwell[k];if(autoT<acc){st=k;break;}}state=st;}
  const tf=state>=2?1:0,ta=state===0?0.16:0.26,tc=state>=1?1:0,tm=state===3?1:0;
  fold+=(tf-fold)*0.011;amp+=(ta-amp)*0.04;colT+=(tc-colT)*0.05;mesh+=(tm-mesh)*0.06;
  const fe=fold*fold*(3-2*fold),meshA=mesh*clamp((fold-0.9)/0.08,0,1),R=Rr();
  const lineFade=clamp(1-fe/0.12,0,1),dotFade=clamp((fe-0.03)/0.16,0,1);
  if(!drag){yaw+=vyaw+0.0012;pitch+=vpitch;vyaw*=0.95;vpitch*=0.95;pitch=clamp(pitch,-1.35,1.35);}
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  const PR=new Array(N);
  for(let k=0;k<N;k++){const P=PTS[k],flatY=amp*1.5*hgt(P.i,P.j),wx=P.px+(P.fib[0]-P.px)*fe,wy=flatY+(P.fib[1]-flatY)*fe,wz=P.pz+(P.fib[2]-P.pz)*fe,r=rot([wx,wy,wz]);PR[k]=[cx+r[0]*R,cy-r[1]*R,r[2]];}
  if(fe>0.55){x.strokeStyle="rgba(255,255,255,"+(0.06*clamp((fe-0.55)/0.3,0,1)).toFixed(2)+")";x.lineWidth=1;x.beginPath();x.arc(cx,cy,R,0,TAU);x.stroke();}
  if(lineFade>0.01){const cr=Math.round(244+(251-244)*colT),cg=Math.round(244+(178-244)*colT),cb=Math.round(245+(106-245)*colT);
   x.lineWidth=1;x.strokeStyle="rgba("+cr+","+cg+","+cb+","+(0.45*lineFade).toFixed(2)+")";
   for(let i=0;i<Ng;i++){x.beginPath();for(let j=0;j<Ng;j++){const s=PR[i*Ng+j];if(j)x.lineTo(s[0],s[1]);else x.moveTo(s[0],s[1]);}x.stroke();}
   for(let j=0;j<Ng;j++){x.beginPath();for(let i=0;i<Ng;i++){const s=PR[i*Ng+j];if(i)x.lineTo(s[0],s[1]);else x.moveTo(s[0],s[1]);}x.stroke();}}
  if(dotFade>0.01){for(let k=0;k<N;k++){const P=PTS[k];if(!P.land)continue;const s=PR[k],d2=s[2];if(d2<-0.04)continue;const sB=0.32+0.68*clamp(d2,0,1);
    const tw=0.85+0.15*Math.sin(t*2.4+k*0.7),al=sB*tw*dotFade;
    x.fillStyle="rgba("+lerpCa(colT)+","+al.toFixed(2)+")";x.fillRect(s[0]-1,s[1]-1,2.2,2.2);}}
  if(meshA>0.01){
   for(let li=0;li<LINKS.length;li++){const a=LINKS[li][0],bb=LINKS[li][1],ra=rot(NODES[a].p),rb=rot(NODES[bb].p),path=[];
    for(let k=0;k<=20;k++){const tt=k/20;let mx=ra[0]+(rb[0]-ra[0])*tt,my=ra[1]+(rb[1]-ra[1])*tt,mz=ra[2]+(rb[2]-ra[2])*tt,L=Math.hypot(mx,my,mz)||1;mx/=L;my/=L;mz/=L;const lift=1+0.16*Math.sin(tt*Math.PI);path.push([cx+(mx*lift)*R,cy-(my*lift)*R,mz]);}
    x.strokeStyle="rgba(255,217,176,"+(0.8*meshA).toFixed(2)+")";x.lineWidth=1.4;let started=false;x.beginPath();for(let k=0;k<path.length;k++){const P=path[k];if(P[2]>=-0.02){if(started)x.lineTo(P[0],P[1]);else{x.moveTo(P[0],P[1]);started=true;}}else started=false;}x.stroke();}
   for(let ni=0;ni<NODES.length;ni++){const n=NODES[ni],r=rot(n.p),s=[cx+r[0]*R,cy-r[1]*R],front=r[2]>=-0.02;n.sx=s[0];n.sy=s[1];n.front=front;if(!front)continue;
    const sel=selNode===ni;x.globalAlpha=meshA;
    if(sel){x.strokeStyle="rgba(251,178,106,"+(0.7*meshA).toFixed(2)+")";x.lineWidth=1.2;x.beginPath();x.arc(s[0],s[1],8,0,TAU);x.stroke();}
    x.fillStyle=FG0;x.beginPath();x.arc(s[0],s[1],4.4,0,TAU);x.fill();x.fillStyle=AMBER;x.beginPath();x.arc(s[0],s[1],2.6,0,TAU);x.fill();
    x.fillStyle=AMBER;x.font="9px ui-monospace,monospace";x.textAlign="left";x.fillText(n.reg,s[0]+8,s[1]-3);
    if(sel){x.fillStyle=AMBER_HI;x.font="9px ui-monospace,monospace";x.fillText(n.ip,s[0]+8,s[1]+8);}x.globalAlpha=1;}}
  const names=["BOOT — grid relief","READY — services up","COLLAPSING -> planet","MESH — connected"];
  x.fillStyle=state>=1?AMBER:FG0;x.font="10px ui-monospace,monospace";x.textAlign="left";x.fillText(names[state],12,20);
  x.fillStyle=FG3;x.fillText((auto?"auto":"manual")+"  zoom "+zoom.toFixed(2)+"x  ·  dbl-click = connect/disconnect"+(mask?"":"  loading atlas…"),12,H-10);
  requestAnimationFrame(d);})();}

MORPH();
})();
</script>
</body>
</html>
