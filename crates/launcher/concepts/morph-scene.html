<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirage centerpiece — morph scene</title>
<style>
  body{margin:0;background:#0b0b0e;color:#f4f4f5;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:18px}
  h1{font-size:13px;letter-spacing:.16em;font-weight:500;color:#fbb26a;margin:0 0 14px}
  .lbl{font-size:11px;color:#878b91;margin-bottom:6px;letter-spacing:.05em}
  .hint{color:#555860}
  .card{background:#14151a;border:1px solid #ffffff14;border-radius:12px;padding:10px;margin-bottom:14px}
  canvas{display:block;width:100%;border-radius:6px;touch-action:none;cursor:grab}
  .mctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .mbtn{font:11px ui-monospace,monospace;background:#0b0b0e;color:#c9ccd1;border:1px solid #ffffff24;border-radius:6px;padding:4px 9px;cursor:pointer;letter-spacing:.04em}
  .mbtn:hover{border-color:#fbb26a;color:#fbb26a}
</style>
</head>
<body>
<h1>MIRAGE · CENTERPIECE — MORPH SCENE</h1>
<div class="card">
  <div class="lbl">RELIEF → SPHERE → MESH <span class="hint">— drag rotate · wheel zoom · buttons isolate each state (auto = full sequence)</span></div>
  <canvas id="gmorph" width="600" height="360" style="background:#0b0b0e"></canvas>
  <div class="mctl">
    <button class="mbtn" data-ms="0">boot</button>
    <button class="mbtn" data-ms="1">services up</button>
    <button class="mbtn" data-ms="2">collapse</button>
    <button class="mbtn" data-ms="3">connected</button>
    <button class="mbtn" id="m-auto">auto: on</button>
  </div>
</div>
<script>
(function(){
const BG="#0b0b0e",FG0="#f4f4f5",FG1="#878b91",FG3="#555860",AMBER="#fbb26a",AMBER_HI="#ffd9b0",RED="#e05656",TAU=Math.PI*2;
const q=id=>document.getElementById(id);
function ihash(i,j,s){let h=(Math.imul(i,374761393)+Math.imul(j,668265263)+s)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=ihash(xi,yi,s),b=ihash(xi+1,yi,s),c=ihash(xi,yi+1,s),d=ihash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

function MORPH(){const c=q("gmorph"),x=c.getContext("2d"),W=c.width,H=c.height,cx=W/2,cy=H/2;
 const Ng=30,ns=4242,PX=[],PZ=[],DIRW=[];
 for(let i=0;i<Ng;i++)for(let j=0;j<Ng;j++){const u=i/(Ng-1),v=j/(Ng-1),px=(u-0.5)*2.0,pz=(v-0.5)*2.0,idx=i*Ng+j;
  PX[idx]=px;PZ[idx]=pz;const rho=Math.hypot(px,pz),rhoN=Math.min(1,rho/1.30),th=rhoN*Math.PI,ph=Math.atan2(pz,px);
  DIRW[idx]=[Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)];}
 const NODES=[{lat:55,lon:37,l:"ru-094.74"},{lat:39,lon:35,l:"tr-094.247"},{lat:52,lon:5,l:"nl-173.104"},{lat:47,lon:8,l:"ch-119.139"},{lat:55,lon:49,l:"ru-245.247"}];
 function v3(la,lo){la*=Math.PI/180;lo*=Math.PI/180;return[Math.cos(la)*Math.cos(lo),Math.sin(la),Math.cos(la)*Math.sin(lo)];}
 NODES.forEach(n=>n.p=v3(n.lat,n.lon));const LINKS=[[0,1],[2,3],[0,4],[1,3]];
 let yaw=0.5,pitch=0.5,vyaw=0.015,vpitch=0,zoom=1,drag=null,t=0;
 let state=0,auto=true,autoT=0,fold=0,colT=0,amp=0.16,mesh=0;
 function rot(p){const cyw=Math.cos(yaw),syw=Math.sin(yaw),x1=p[0]*cyw+p[2]*syw,z1=-p[0]*syw+p[2]*cyw,y1=p[1];
  const cp=Math.cos(pitch),sp=Math.sin(pitch),y2=y1*cp-z1*sp,z2=y1*sp+z1*cp;return[x1,y2,z2];}
 const Rr=()=>150*zoom;
 function manual(s){auto=false;state=s;lbl();}
 function lbl(){const b=q("m-auto");if(b)b.textContent="auto: "+(auto?"on":"off");}
 c.addEventListener("pointerdown",e=>{drag={x:e.offsetX,y:e.offsetY,m:0};vyaw=vpitch=0;c.style.cursor="grabbing";});
 c.addEventListener("pointermove",e=>{if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);yaw+=dx*0.008;pitch=Math.max(-1.35,Math.min(1.35,pitch+dy*0.008));vyaw=dx*0.008;vpitch=dy*0.008;drag.x=e.offsetX;drag.y=e.offsetY;}});
 window.addEventListener("pointerup",()=>{if(drag&&drag.m<6)manual(state<2?2:state);drag=null;c.style.cursor="grab";});
 c.addEventListener("wheel",e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:0.926;zoom=Math.max(0.6,Math.min(3.2,zoom));},{passive:false});
 document.querySelectorAll("[data-ms]").forEach(b=>b.addEventListener("click",()=>manual(+b.dataset.ms)));
 const ab=q("m-auto");if(ab)ab.addEventListener("click",()=>{auto=!auto;autoT=0;lbl();});
 const dwell=[150,150,300,320],total=dwell.reduce((a,b)=>a+b,0);
 function hgt(i,j){return (vnoise(i*0.22,j*0.22+t*0.4,ns)-0.5)+0.25*Math.sin((i+j)*0.42+t*1.8);}
 (function d(){t+=0.016;
  if(auto){autoT++;if(autoT>=total)autoT=0;let acc=0,st=0;for(let k=0;k<dwell.length;k++){acc+=dwell[k];if(autoT<acc){st=k;break;}}state=st;}
  const tf=state>=2?1:0,ta=state===0?0.16:0.26,tc=state>=1?1:0,tm=state===3?1:0;
  fold+=(tf-fold)*0.011;amp+=(ta-amp)*0.04;colT+=(tc-colT)*0.05;mesh+=(tm-mesh)*0.06;
  const fe=fold*fold*(3-2*fold),meshA=mesh*Math.max(0,Math.min(1,(fold-0.9)/0.08));
  if(!drag){yaw+=vyaw+0.0012;pitch+=vpitch;vyaw*=0.95;vpitch*=0.95;pitch=Math.max(-1.35,Math.min(1.35,pitch));}
  x.fillStyle=BG;x.fillRect(0,0,W,H);
  const PR=new Array(Ng*Ng),R=Rr();
  for(let i=0;i<Ng;i++)for(let j=0;j<Ng;j++){const idx=i*Ng+j,px=PX[idx],pz=PZ[idx],D=DIRW[idx],hh=amp*1.6*hgt(i,j);
   const p=rot([px+(D[0]-px)*fe,hh+(D[1]-hh)*fe,pz+(D[2]-pz)*fe]);PR[idx]=[cx+p[0]*R,cy-p[1]*R,p[2]];}
  const cr=Math.round(244+(251-244)*colT),cg=Math.round(244+(178-244)*colT),cb=Math.round(245+(106-245)*colT),gridA=(0.5-0.34*meshA);
  x.lineWidth=1;x.strokeStyle="rgba("+cr+","+cg+","+cb+","+gridA.toFixed(2)+")";
  for(let i=0;i<Ng;i++){x.beginPath();for(let j=0;j<Ng;j++){const s=PR[i*Ng+j];if(j)x.lineTo(s[0],s[1]);else x.moveTo(s[0],s[1]);}x.stroke();}
  for(let j=0;j<Ng;j++){x.beginPath();for(let i=0;i<Ng;i++){const s=PR[i*Ng+j];if(i)x.lineTo(s[0],s[1]);else x.moveTo(s[0],s[1]);}x.stroke();}
  if(meshA>0.01){
   for(let li=0;li<LINKS.length;li++){const a=LINKS[li][0],bb=LINKS[li][1],ra=rot(NODES[a].p),rb=rot(NODES[bb].p),path=[];
    for(let k=0;k<=20;k++){const tt=k/20;let mx=ra[0]+(rb[0]-ra[0])*tt,my=ra[1]+(rb[1]-ra[1])*tt,mz=ra[2]+(rb[2]-ra[2])*tt,L=Math.hypot(mx,my,mz)||1;mx/=L;my/=L;mz/=L;const lift=1+0.16*Math.sin(tt*Math.PI);path.push([cx+(mx*lift)*R,cy-(my*lift)*R,mz]);}
    x.strokeStyle="rgba(255,217,176,"+(0.75*meshA).toFixed(2)+")";x.lineWidth=1.4;let started=false;x.beginPath();for(let k=0;k<path.length;k++){const P=path[k];if(P[2]>=-0.02){if(started)x.lineTo(P[0],P[1]);else{x.moveTo(P[0],P[1]);started=true;}}else started=false;}x.stroke();
    const bt=(t*0.22+li*0.27)%1,bi=Math.floor(bt*(path.length-1)),bp=path[bi];if(bp&&bp[2]>=-0.02){x.globalAlpha=meshA;x.fillStyle=AMBER_HI;x.beginPath();x.arc(bp[0],bp[1],2.6,0,TAU);x.fill();x.globalAlpha=1;}}
   for(const n of NODES){const r=rot(n.p),s=[cx+r[0]*R,cy-r[1]*R],front=r[2]>=-0.02;if(!front)continue;x.globalAlpha=meshA;
    x.fillStyle=FG0;x.beginPath();x.arc(s[0],s[1],4.2,0,TAU);x.fill();x.fillStyle=AMBER;x.beginPath();x.arc(s[0],s[1],2.4,0,TAU);x.fill();
    if(zoom>1.1){x.fillStyle=FG0;x.font="9px ui-monospace,monospace";x.textAlign="left";x.fillText(n.l,s[0]+7,s[1]+3);}x.globalAlpha=1;}}
  const names=["BOOT — relief","READY — services up","COLLAPSING -> sphere","MESH — connected"];
  x.fillStyle=state>=1?AMBER:FG0;x.font="10px ui-monospace,monospace";x.textAlign="left";x.fillText(names[state],12,20);
  x.fillStyle=FG3;x.fillText((auto?"auto":"manual")+"  zoom "+zoom.toFixed(2)+"x",12,H-10);
  requestAnimationFrame(d);})();}

MORPH();
})();
</script>
</body>
</html>
