[workspace]
resolver = "2"
members = [
    "crates/client-core",
    # "crates/cli",  # cli1 (mirage-client-cli) RETIRED 2026-06-14 → crates/_deprecated/cli
    "crates/cli2/ipc",
    "crates/cli2/ota",
    "crates/cli2/worker",
    "crates/cli2/supervisor",
    # "crates/desktop/windows/v2",  # legacy — uses path-deps to uzor; conflicts with crates.io uzor used by launcher
    "crates/l0-sentinel",
    "crates/l0-orchestrator",
    # "crates/desktop-cli",  # legacy pre-orchestrator launcher (spawned cli1) — RETIRED 2026-06-14 → crates/_deprecated/desktop-cli
    "crates/runtime-guard",
    "crates/debug-shell",
    "crates/launcher",
    # "crates/client-gui",  # uses vello-gpu + wgpu 29; windows-core version conflicts with launcher workspace — own workspace root
    "crates/awg-share-gen",
    "crates/v2ray-share-gen",
    "crates/foreign-probe",
    # "crates/mobile",  # cdylib — skip on Windows build
    # "crates/mirage-pt-adapter",  # arc3 Phase-0 Tor PT+bridge spike — DELETED 2026-07-31.
    # Superseded by transparent-forward per the 2026-07-24 canon: one commit
    # (2f8e7ba), never touched again, absent from every live-proof commit. It
    # had also stopped compiling (E0106), and because it is a workspace member
    # that broke `cargo test` for this whole repo — zero client tests ran.
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio               = { version = "1", features = ["full"] }
tokio-util          = { version = "0.7", features = ["codec", "rt"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
clap                = { version = "4", features = ["derive"] }
thiserror           = "2"
futures             = "0.3"
rand                = "0.8"
bytes               = "1"
arc-swap            = "1"
axum                = "0.8"
reqwest             = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
mirage-core         = { path = "../mirage2web/crates/mirage-core" }
mirage-protocol     = { path = "../mirage2web/crates/mirage-protocol" }
mirage-mux          = { path = "../mirage2web/crates/mirage-mux" }
mirage-control-plane = { path = "../mirage2web/crates/mirage-dial-core" }
mirage-client-core  = { path = "crates/client-core" }
tokio-tungstenite       = { version = "0.24", features = ["rustls-tls-native-roots"] }
mirage-runtime-guard    = { path = "crates/runtime-guard" }
mirage-standalone-templates = { path = "../mirage2web/crates/mirage-standalone-templates" }
mirage-mesh-client  = { path = "../mirage2web/crates/mirage-mesh-client" }
mirage-ringmember   = { path = "../mirage2web/crates/mirage-ringmember" }
ed25519-dalek       = { version = "2", features = ["rand_core"] }
